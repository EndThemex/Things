<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Things · 物品库存管理</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* 默认浅色布局底色，深色由下方脚本覆盖 */
      html {
        background: #f5f5f5;
      }
    </style>
    <script>
      // 首帧绘制前同步主题背景，避免先白屏再变黑的闪烁
      // 背景色需与 antd colorBgLayout 保持一致：深色 #000、浅色 #f5f5f5
      (function () {
        var saved = localStorage.getItem("things_theme");
        var dark =
          saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#000000" : "#f5f5f5";
        root.style.color = dark ? "rgba(255, 255, 255, 0.85)" : "rgba(0, 0, 0, 0.88)";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
